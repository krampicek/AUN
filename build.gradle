plugins {
    // Minecraft 26.x is unobfuscated: use the non-remapping Loom plugin.
    // If this id is not found, copy the plugin line from the project generated at fabricmc.net/develop.
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.shedaniel.me/' }                     // Cloth Config
    maven { url = 'https://maven.terraformersmc.com/releases/' }      // Mod Menu
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // No 'mappings' line: Mojang names are used directly.

    // Unobfuscated game => plain 'implementation' instead of 'modImplementation'.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: 'net.fabricmc.fabric-api')
    }
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// ---------------------------------------------------------------------------------
// Prints information about Minecraft's own classes into the build log (lines start
// with AUNAPI). It is only used to write new features correctly and never fails the build.
// ---------------------------------------------------------------------------------
tasks.register('inspectGameApi') {
    doLast {
        try {
            def gameJar = null
            for (File f : fileTree(dir: new File(System.getProperty('user.home'), '.gradle'), include: '**/*.jar').files) {
                if (f.length() < 20_000_000L) continue
                def zip = new java.util.zip.ZipFile(f)
                try {
                    if (zip.getEntry('net/minecraft/world/entity/LightningBolt.class') != null) { gameJar = f; break }
                } finally { zip.close() }
            }
            if (gameJar == null) { println 'AUNAPI game jar not found'; return }

            def javap = new File(System.getProperty('java.home'), 'bin/javap').absolutePath
            def names = []
            def zip = new java.util.zip.ZipFile(gameJar)
            try { zip.entries().each { if (it.name.endsWith('.class')) names << it.name } } finally { zip.close() }

            def members = { String cls, String filter ->
                def process = new ProcessBuilder(javap, '-p', '-cp', gameJar.absolutePath, cls).redirectErrorStream(true).start()
                def lines = process.inputStream.text.readLines()
                println "AUNAPI #### ${cls}"
                lines.findAll { filter == null || (it =~ filter) }.each { println "AUNAPI ${it.trim()}" }
            }

            members('net.minecraft.world.entity.Entity', '(?i)tag')
            members('net.minecraft.world.entity.player.Player', '(?i)(message|overlay)')
            members('net.minecraft.server.level.ServerPlayer', '(?i)(message|overlay)')
            members('net.minecraft.world.entity.item.ItemEntity', '(?i)(age|lifetime|thrower|owner)')
            members('net.minecraft.client.input.KeyEvent', null)
            members('net.minecraft.client.input.MouseButtonEvent', null)
            members('net.minecraft.client.input.CharacterEvent', null)
            members('net.minecraft.client.input.InputWithModifiers', null)
            members('net.minecraft.world.inventory.ContainerInput', null)
            members('net.minecraft.world.inventory.Slot', '(container|getItem|index|public)')
            members('net.minecraft.world.item.component.ItemContainerContents', '(?i)(items|stream|nonEmpty|copy)')
            members('net.minecraft.world.item.component.BundleContents', '(?i)(items|size|isEmpty|weight)')
            members('net.minecraft.client.gui.screens.inventory.tooltip.ClientBundleTooltip', null)
            members('net.minecraft.client.Options', '(?i)(keyDrop|keyAttack|keyInventory|keySprint|keyUse|gamma|fullscreen)')
            members('net.minecraft.client.gui.contextualbar.LocatorBar', null)
            members('com.mojang.blaze3d.platform.Window', '(?i)(fullscreen|decorat|borderless|getWindow|getScreenWidth|monitor|setWindowed|toggle)')
            members('net.minecraft.client.Minecraft', '(?i)(getWindow|font|setScreen|screen;|options;)')
            members('net.minecraft.client.gui.components.AbstractSelectionList$Entry', null)
            members('net.minecraft.client.gui.components.ObjectSelectionList$Entry', null)
            members('net.minecraft.client.gui.components.AbstractSelectionList', '(?i)(getRow|getX|getY|getWidth|getHeight|getContent|scroll|rowLeft|rowRight|children)')
            members('net.minecraft.client.gui.components.AbstractWidget', '(?i)(focus|keyPressed|canConsume|setX|setY|setWidth|getX|getY)')
            members('net.minecraft.client.gui.components.Button', '(?i)(builder|Builder)')
            members('net.minecraft.client.gui.components.Button$Builder', null)
            members('net.minecraft.world.level.storage.LevelStorageSource', '(?i)(delete|trash|backup|recover|levelDirectory|getBaseDir)')
            members('net.minecraft.world.level.storage.LevelStorageSource$LevelStorageAccess', '(?i)(delete|trash|getLevelDirectory|getLevelId)')
            members('net.minecraft.client.player.LocalPlayer', '(?i)sprint')
            members('net.minecraft.client.gui.screens.inventory.EffectsInInventory', null)
            names.findAll { it =~ 'net/minecraft/client/renderer/entity/layers/.*Armor.*' }.sort().each { println "AUNAPI ${it}" }
            names.findAll { it =~ 'net/minecraft/client/renderer/entity/state/(Player|Humanoid|Avatar).*' }.sort().each { println "AUNAPI ${it}" }
            names.findAll { it =~ 'net/minecraft/client/gui/screens/(PackSelectionScreen|.*Pack.*)' }.sort().each { println "AUNAPI ${it}" }
            names.findAll { it =~ '(?i)ServerPackManager|PackCompat|PackSource' }.sort().each { println "AUNAPI ${it}" }
        } catch (Throwable t) {
            println "AUNAPI inspection failed: ${t}"
        }
    }
}
tasks.named('compileJava') { finalizedBy 'inspectGameApi' }
